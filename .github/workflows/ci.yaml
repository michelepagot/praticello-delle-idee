name: CI Checks

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Cache Quartz plugins
        uses: actions/cache@v6
        with:
          path: .quartz/plugins
          key: ${{ runner.os }}-plugins-${{ hashFiles('quartz.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-plugins-

      - name: Install dependencies
        run: npm ci

      - name: Install Quartz plugins
        run: npx quartz plugin install

      - name: Check types and formatting
        run: npm run check

      - name: Run unit tests
        run: npm test

      - name: Run yamllint
        run: |
          yamllint -d "{extends: default, rules: {line-length: disable, document-start: disable, truthy: disable, comments: disable, trailing-spaces: disable}}" .github/workflows/*.yml *.yaml

      - name: Check for invalid double-slash comments in YAML files
        run: |
          if grep -rn -E '(^|[[:space:]])//' --include='*.yaml' --include='*.yml' .; then
            echo "::error::Found double-slash '//' in YAML files which is interpreted as part of value instead of comment."
            exit 1
          else
            echo "No invalid double-slash comments found in YAML files."
          fi

      - name: Ensure Quartz builds successfully
        run: npx quartz build -d praticello_delle_idee
